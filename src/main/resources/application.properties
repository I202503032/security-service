spring.application.name=security-service
server.port=8081
# Muestra el mensaje de los errores (ej. "Email o contraseña incorrectos") en la respuesta
spring.web.error.include-message=always

# Base de datos (los valores por defecto apuntan a la MySQL de la Windows; en Docker se pasan por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.100.22:3306/bd_security?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:bodega}
spring.datasource.password=${DB_PASSWORD:Bodega!}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (HS256: el secreto debe tener al menos 32 caracteres y ser el mismo en el api-gateway)
jwt.secret=${JWT_SECRET:mibodeguita-clave-secreta-desarrollo-2026}
jwt.expiration-minutes=120

# Usuario ADMIN que se crea al arrancar si no existe
admin.email=${ADMIN_EMAIL:admin@mibodeguita.com}
admin.password=${ADMIN_PASSWORD:admin123}

# Feign: URL del movement-service (cuando haya Eureka se reemplaza por el nombre del servicio)
movement.service.url=${MOVEMENT_SERVICE_URL:http://localhost:8083}
